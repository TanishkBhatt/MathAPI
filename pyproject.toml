[project]
name = "mathapi"
version = "1.0.0"
description = "api services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pydantic[email]>=2.13.4",
    "pymongo>=4.17.0",
    "slowapi>=0.1.9",
    "motor>=3.7.1",
]

[dependency-groups]
dev = [
    "uv-script>=0.1.9",
    "requests>=2.34.2",
    "pytest>=8.0",
    "streamlit>=1.40.0",
]

[tool.uvs.scripts]
dev = "uvicorn backend.main:app --reload"
start = "uvicorn backend.main:app"
test = "pytest test/pytest -v"
demo-project = "streamlit run test/project/streamlit_app.py"